name: Build Rust Encoder

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libssl-dev pkg-config
      - name: Apply standard Rust formatting (CI workspace)
        run: cargo fmt --all
      - name: Check all targets
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Package portable binary
        shell: python
        run: |
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          platform = os.environ['RUNNER_OS'].lower()
          exe = Path('target/release/rust-encoder' + ('.exe' if platform == 'windows' else ''))
          assert exe.is_file(), f'Missing release binary: {exe}'
          out = Path('dist')
          out.mkdir(exist_ok=True)
          with ZipFile(out / f'rust-encoder-{platform}.zip', 'w', ZIP_DEFLATED) as package:
              package.write(exe, exe.name)
              for name in ('README.md', 'LICENSE', 'TESTING.md'):
                  package.write(name)
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: rust-encoder-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
