name: Build Rust Encoder

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-encoder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libssl-dev libasound2-dev pkg-config ffmpeg
      - name: Format CI checkout (legacy formatting baseline)
        run: cargo fmt --all
      - name: Check all targets
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Verify first-run FFmpeg download on Windows
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cargo test --lib dependencies::tests::bootstrap_downloads_and_validates_real_ffmpeg -- --ignored --exact
      - name: Lint
        run: cargo clippy --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Smoke-test built executable
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          platform = os.environ['RUNNER_OS'].lower()
          exe = Path('target/release/rust-encoder' + ('.exe' if platform == 'windows' else '')).resolve()
          result = subprocess.run([str(exe), '--version'], check=True, capture_output=True, text=True, timeout=20)
          print(result.stdout.strip())
          assert result.stdout.strip() == 'Rust Encoder 0.1.0', result.stdout
      - name: Package portable binary
        shell: python
        run: |
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          platform = os.environ['RUNNER_OS'].lower()
          exe = Path('target/release/rust-encoder' + ('.exe' if platform == 'windows' else ''))
          assert exe.is_file(), f'Missing release binary: {exe}'
          out = Path('dist')
          out.mkdir(exist_ok=True)
          with ZipFile(out / f'rust-encoder-{platform}.zip', 'w', ZIP_DEFLATED) as package:
              package.write(exe, exe.name)
              for name in ('README.md', 'LICENSE', 'TESTING.md'):
                  package.write(name)
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: rust-encoder-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    name: Publish rolling release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rust-encoder-*
          path: release-assets
          merge-multiple: true
      - name: Verify bundles and generate checksums
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('release-assets')
          expected = {
              'rust-encoder-windows.zip': 'rust-encoder.exe',
              'rust-encoder-linux.zip': 'rust-encoder',
              'rust-encoder-macos.zip': 'rust-encoder',
          }
          archives = {p.name: p for p in root.glob('*.zip')}
          if archives.keys() != expected.keys():
              raise SystemExit(f'Missing or unexpected platform ZIPs: {sorted(archives)}')
          sums = []
          for name, executable in expected.items():
              path = archives[name]
              with ZipFile(path) as bundle:
                  needed = {executable, 'README.md', 'LICENSE', 'TESTING.md'}
                  if not needed.issubset(bundle.namelist()):
                      raise SystemExit(f'Incomplete archive {name}: {needed - set(bundle.namelist())}')
                  if bundle.testzip() is not None:
                      raise SystemExit(f'Corrupt archive: {name}')
                  if bundle.getinfo(executable).file_size == 0:
                      raise SystemExit(f'Empty executable in {name}')
              digest = sha256(path.read_bytes()).hexdigest()
              sums.append(f'{digest}  {name}')
              print(f'Verified {name} ({path.stat().st_size} bytes)')
          (root / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
      - name: Publish or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Rolling development build from \`main\`, commit \`${GITHUB_SHA}\`.
          
          Portable Windows, Linux, and macOS executables are attached with SHA-256 checksums.
          FFmpeg/FFprobe and optional FFplay are external dependencies and are not bundled.
          These builds are not installers, signed, or notarized.
          EOF
          if gh release view rolling >/dev/null 2>&1; then
            # Keep the existing release and its URL; overwrite assets only after all builds pass.
            gh release upload rolling release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
            gh release edit rolling --title 'Rust Encoder (Rolling)' --notes-file release-notes.md --prerelease
            # Move the reusable tag only after the new release assets upload successfully.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/rolling" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/rolling" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/rolling" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/rolling' -f sha="${GITHUB_SHA}" >/dev/null
            fi
            gh release create rolling release-assets/*.zip release-assets/SHA256SUMS.txt \
              --title 'Rust Encoder (Rolling)' --notes-file release-notes.md --prerelease
          fi
